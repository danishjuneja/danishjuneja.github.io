---
layout: default
---
<article class="content-page shell">
  <p class="eyebrow">Writing{% if page.date %} · {{ page.date | date: "%d %b %Y" }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="hero-line">{{ page.description }}</p>{% endif %}
  <div class="prose content-prose">{{ content }}</div>
  {% if page.tags %}<p class="tag-list">{% for tag in page.tags %}<span>{{ tag }}</span>{% endfor %}</p>{% endif %}
</article>
